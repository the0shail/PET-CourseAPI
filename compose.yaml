services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: course-api-postgres
    environment:
      - 'POSTGRES_DB=course_api'
      - 'POSTGRES_USER=the0shail'
      - 'POSTGRES_PASSWORD=the0shail'
    ports:
      - '55432:5432'

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the0shail -d course_api"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
